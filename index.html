      // Theme before first paint (no light flash for dark-mode viewers): light unless dark was chosen.
      (function () {
        var t = null;
        try { t = localStorage.getItem('csl-theme'); } catch (e) {}
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      })();
    </script>
